<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Justa — Shared bills, split fairly</title>
  <meta name="description" content="A private household ledger for people who share a home. Plan the month by income, log extras, settle who pays whom. On your iPhone. No account. No server." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#F9F3E5" />
  <meta property="og:title" content="Justa — Shared bills, split fairly" />
  <meta property="og:description" content="Shared bills, split fairly. Private by design." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aacnsilva.com/justa/" />
  <meta property="og:image" content="https://aacnsilva.com/justa/appicon.png" />
  <link rel="icon" href="appicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="appicon.png" />
  <style>
    :root {
      --cream: #F9F3E5;
      --pine: #1A3A32;
      --terracotta: #C86A46;
      --pine-mute: #5A6B64;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--cream);
      color: var(--pine);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--terracotta); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 0.15em; }

    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    /* Hero composite is the visual — Liberty lock with real phone screen */
    .hero {
      position: relative;
      width: min(100%, 1280px);
      margin: 0 auto;
      line-height: 0;
    }
    .hero > img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      vertical-align: top;
    }

    /* Invisible hit areas mapped to Liberty art (% of 1280×720) */
    .hit {
      position: absolute;
      display: block;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: default;
      text-indent: -9999px;
      overflow: hidden;
      white-space: nowrap;
    }
    .hit:focus-visible {
      outline: 2px solid var(--terracotta);
      outline-offset: 2px;
      text-indent: 0;
      color: transparent;
    }

    /* Terracotta badge → Coming soon (disabled; no store URL) */
    .hit-cta {
      left: 7.109%;
      top: 68.611%;
      width: 20.547%;
      height: 15%;
      border-radius: 0.6em;
      cursor: not-allowed;
    }

    .meta {
      width: min(100%, 1280px);
      margin: 0.35rem auto 1rem;
      padding: 0 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1rem;
      justify-content: center;
      align-items: center;
      font-size: 0.78rem;
      line-height: 1.4;
      color: var(--pine-mute);
    }
    .meta a { color: var(--pine-mute); }
    .meta a:hover { color: var(--terracotta); }
    .meta .sep { opacity: 0.45; user-select: none; }

    @media (max-width: 640px) {
      .stage { justify-content: flex-start; padding-top: 0; }
      .meta { font-size: 0.72rem; margin-top: 0.5rem; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="hero" aria-label="Justa — Shared bills, split fairly">
      <img
        src="hero-composite.png"
        width="1280"
        height="720"
        alt="Justa: Shared bills, split fairly. An income-share plan for couples. App preview on iPhone. Free on iOS — Coming soon."
        decoding="async"
        fetchpriority="high"
      />
      <!-- Coming soon over Liberty App Store art (disabled; no store URL) -->
      <a
        class="hit hit-cta"
        href="#"
        role="link"
        aria-disabled="true"
        tabindex="0"
        title="Coming soon"
        onclick="return false;"
      >Coming soon</a>
    </div>

    <nav class="meta" aria-label="Site">
      <a href="./privacy/">Privacy</a>
      <span class="sep" aria-hidden="true">·</span>
      <a href="mailto:aacnsilva@hotmail.com">Support</a>
      <span class="sep" aria-hidden="true">·</span>
      <span>© Justa</span>
      <span class="sep" aria-hidden="true">·</span>
      <span>App Store coming soon</span>
    </nav>
  </main>
</body>
</html>

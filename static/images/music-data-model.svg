<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" role="img" aria-labelledby="title desc">
  <title id="title">Data model of the music lessons</title>
  <desc id="desc">Each instrument has one curriculum.yaml that lists modules and, inside them, lesson slugs in order. Each lesson is one YAML file with title, summary, level, minutes, goals and an ordered list of blocks. A block is typed content keyed by type: text, chord, fretboard, playalong, keyboard, tab, chart, exercise, video, image or audio.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1.2 L 8 5 L 0 8.8 z" fill="#5c7568"/></marker></defs>
  <rect width="760" height="462" rx="16" fill="#fffaf3" stroke="#d9d0c3" stroke-width="1"/>
  <rect x="40" y="28" width="325" height="176" rx="12" fill="#f7f3ed" stroke="#d9d0c3"/>
  <text x="60" y="60" text-anchor="start" fill="#25231f" font-family="Georgia, Times New Roman, serif" font-size="19">Curriculum</text>
  <text x="60" y="82" text-anchor="start" fill="#5c7568" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">lessons/&lt;instrument&gt;/curriculum.yaml</text>
  <text x="60" y="110" text-anchor="start" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">instrument, title</text>
  <text x="60" y="131" text-anchor="start" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">modules[ ]: slug, title, lessons[ ]</text>
  <text x="60" y="162" text-anchor="start" fill="#6d675f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5">The only place lesson order lives. Every</text>
  <text x="60" y="179" text-anchor="start" fill="#6d675f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5">lesson file is listed here exactly once.</text>
  <rect x="415" y="28" width="305" height="176" rx="12" fill="#f7f3ed" stroke="#d9d0c3"/>
  <text x="435" y="60" text-anchor="start" fill="#25231f" font-family="Georgia, Times New Roman, serif" font-size="19">Lesson</text>
  <text x="435" y="82" text-anchor="start" fill="#5c7568" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">lessons/&lt;instrument&gt;/lessons/&lt;slug&gt;.yaml</text>
  <text x="435" y="110" text-anchor="start" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">title, summary, level, minutes</text>
  <text x="435" y="131" text-anchor="start" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">goals[ ]</text>
  <text x="435" y="152" text-anchor="start" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">blocks[ ]</text>
  <text x="435" y="179" text-anchor="start" fill="#6d675f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5">The file name is the lesson slug.</text>
  <line x1="369" y1="116" x2="409" y2="116" stroke="#5c7568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="106" text-anchor="middle" fill="#6d675f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">1..n</text>
  <line x1="570" y1="208" x2="570" y2="244" stroke="#5c7568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="582" y="231" text-anchor="start" fill="#6d675f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">1..n</text>
  <rect x="40" y="250" width="680" height="184" rx="12" fill="#eef4f0" stroke="#5c7568" stroke-width="1.75"/>
  <text x="60" y="284" text-anchor="start" fill="#25231f" font-family="Georgia, Times New Roman, serif" font-size="19">Block</text>
  <text x="122" y="284" text-anchor="start" fill="#6d675f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">typed content, keyed by type and rendered top to bottom</text>
  <rect x="60" y="304" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="109.0" y="322.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">text</text>
  <rect x="168" y="304" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="217.0" y="322.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">chord</text>
  <rect x="276" y="304" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="325.0" y="322.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">fretboard</text>
  <rect x="384" y="304" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="433.0" y="322.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">playalong</text>
  <rect x="492" y="304" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="541.0" y="322.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">keyboard</text>
  <rect x="600" y="304" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="649.0" y="322.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">tab</text>
  <rect x="60" y="342" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="109.0" y="360.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">chart</text>
  <rect x="168" y="342" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="217.0" y="360.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">exercise</text>
  <rect x="276" y="342" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="325.0" y="360.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">video</text>
  <rect x="384" y="342" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="433.0" y="360.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">image</text>
  <rect x="492" y="342" width="98" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="541.0" y="360.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">audio</text>
  <text x="60" y="410" text-anchor="start" fill="#38342f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">A new kind of content is a new block type plus a renderer, never free-form HTML.</text>
</svg>

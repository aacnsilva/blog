<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 568" role="img" aria-labelledby="title desc">
  <title id="title">Guardrails and checks in the music-lessons repo</title>
  <desc id="desc">Four layers: rules written down in the repo, a pre-commit hook that lints and formats staged files, npm run check which runs format, lint, types, tests and build, and CI that runs the same five steps on every pull request.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1.2 L 8 5 L 0 8.8 z" fill="#5c7568"/></marker></defs>
  <rect width="760" height="568" rx="16" fill="#fffaf3" stroke="#d9d0c3" stroke-width="1"/>
  <rect x="48" y="28" width="664" height="112" rx="12" fill="#f7f3ed" stroke="#d9d0c3"/>
  <circle cx="88" cy="84.0" r="18" fill="#5c7568"/>
  <text x="88" y="90.0" text-anchor="middle" fill="#f8fbf7" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700">1</text>
  <text x="124" y="68" text-anchor="start" fill="#25231f" font-family="Georgia, Times New Roman, serif" font-size="20">Rules live in the repo</text>
  <text x="124" y="92" text-anchor="start" fill="#6d675f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">AGENTS.md, ESLint and the strictest TypeScript settings.</text>
  <text x="124" y="113" text-anchor="start" fill="#6d675f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">No comments, no inline disables, small functions.</text>
  <line x1="380" y1="140" x2="380" y2="166" stroke="#5c7568" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="172" width="664" height="96" rx="12" fill="#f7f3ed" stroke="#d9d0c3"/>
  <circle cx="88" cy="220.0" r="18" fill="#5c7568"/>
  <text x="88" y="226.0" text-anchor="middle" fill="#f8fbf7" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700">2</text>
  <text x="124" y="212" text-anchor="start" fill="#25231f" font-family="Georgia, Times New Roman, serif" font-size="20">Pre-commit hook</text>
  <text x="124" y="238" text-anchor="start" fill="#6d675f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Lints and formats the staged files before every commit.</text>
  <line x1="380" y1="268" x2="380" y2="294" stroke="#5c7568" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="300" width="664" height="112" rx="12" fill="#f7f3ed" stroke="#d9d0c3"/>
  <circle cx="88" cy="356.0" r="18" fill="#5c7568"/>
  <text x="88" y="362.0" text-anchor="middle" fill="#f8fbf7" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700">3</text>
  <text x="124" y="340" text-anchor="start" fill="#25231f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">npm run check</text>
  <rect x="124" y="358" width="82" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="165.0" y="376.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">format</text>
  <rect x="216" y="358" width="82" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="257.0" y="376.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">lint</text>
  <rect x="308" y="358" width="82" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="349.0" y="376.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">types</text>
  <rect x="400" y="358" width="82" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="441.0" y="376.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">tests</text>
  <rect x="492" y="358" width="82" height="28" rx="14.0" fill="#fffaf3" stroke="#d9d0c3"/>
  <text x="533.0" y="376.5" text-anchor="middle" fill="#38342f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">build</text>
  <line x1="380" y1="412" x2="380" y2="438" stroke="#5c7568" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="444" width="664" height="96" rx="12" fill="#eef4f0" stroke="#5c7568" stroke-width="1.75"/>
  <circle cx="88" cy="492.0" r="18" fill="#5c7568"/>
  <text x="88" y="498.0" text-anchor="middle" fill="#f8fbf7" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700">4</text>
  <text x="124" y="484" text-anchor="start" fill="#25231f" font-family="Georgia, Times New Roman, serif" font-size="20">CI on every pull request</text>
  <text x="124" y="510" text-anchor="start" fill="#38342f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">GitHub Actions runs the same five steps before a change reaches main.</text>
</svg>

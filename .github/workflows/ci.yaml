name: Check
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        # Installs the version and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys:
            cargo-${{ runner.os }}-
      - name: Format, lint and test
        run: ./scripts/check.sh
